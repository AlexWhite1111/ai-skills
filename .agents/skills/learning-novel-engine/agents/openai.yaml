interface:
  display_name: "Learning Novel Engine"
  short_description: "把真实知识变成由人物选择、证据与后果驱动的长篇小说，并维护读者证据、视觉来源、连续性和盲式评测"
  default_prompt: "Use $learning-novel-engine to create or revise this learning novel with double-causal scene design: story pressure must make the knowledge necessary, and the knowledge update must change character choice or consequence. Preserve technical and visual provenance, character-specific prose, expected reader evidence, continuity, isolated audits, and baseline evaluation."
